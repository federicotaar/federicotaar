<svg xmlns="http://www.w3.org/2000/svg" width="880" height="88" viewBox="0 0 880 88">
  <style>
    .grid { animation: pan 16s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C8F04A" opacity="0.06"/></pattern><linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8F04A"/><stop offset="1" stop-color="#A8D63C"/></linearGradient></defs>
  <rect width="880" height="88" rx="16" fill="#0C0E11"/>
  <rect class="grid" x="-48" y="-48" width="976" height="184" fill="url(#dots)"/>
  <rect x="28" y="24" width="6" height="40" rx="3" fill="#C8F04A"/>
  <text x="51" y="40" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#BCEA44" letter-spacing="3">02 / STACK</text>
  <text x="50" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1E9">Tech</text>
  <rect x="640" y="43" width="196" height="2" rx="1" fill="url(#barGrad)" opacity=".5"/>
  <circle class="pulse" cx="846" cy="44" r="4" fill="#C8F04A"/>
</svg>