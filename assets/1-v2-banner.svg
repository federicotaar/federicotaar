<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <style>
    .grid { animation: pan 16s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
    .orb1 { animation: orbA 24s ease-in-out infinite; }
    .orb2 { animation: orbB 31s ease-in-out infinite; }
    @keyframes orbA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,60px); } }
    @keyframes orbB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(190px,-70px); } }
    .p { fill: #C8F04A; animation: rise 12s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .45; } 75% { opacity: .25; } 100% { transform: translateY(-480px); opacity: 0; } }
    .logo { animation: logoGlow 4.5s ease-in-out .6s infinite; transform-origin: 236px 192px; }
    @keyframes logoGlow { 0%,100% { filter: drop-shadow(0 0 8px rgba(200,240,74,.14)); } 50% { filter: drop-shadow(0 0 26px rgba(200,240,74,.38)); } }
    .orbit { animation: spin 26s linear infinite; transform-origin: 236px 192px; }
    .orbit2 { animation: spin 40s linear infinite reverse; transform-origin: 236px 192px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .name { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size: 76px; font-weight: 700; fill: url(#nameGrad); }
    .tag { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size: 34px; font-weight: 600; fill: #C8F04A; }
    .sub { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size: 25px; fill: #969AA0; }
    .mask { fill: #0A0C0F; animation: reveal 2.2s linear .7s both, maskFade .5s ease 3.2s both; }
    @keyframes reveal { from { transform: translateX(0); } to { transform: translateX(653px); } }
    @keyframes maskFade { to { opacity: 0; } }
    .cursor { fill: #C8F04A; opacity: 0; animation: cursorMove 2.2s linear .7s both, cursorShow 0s .7s both, blink .8s step-end 3s infinite, cursorHide .5s ease 8s both; }
    @keyframes cursorMove { from { transform: translateX(0); } to { transform: translateX(653px); } }
    @keyframes cursorShow { to { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes cursorHide { to { opacity: 0; } }
    .beam { animation: beam 4.5s ease-in-out infinite; }
    @keyframes beam { 0% { transform: translateX(-300px); } 60%,100% { transform: translateX(1900px); } }
  </style>
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C8F04A" opacity="0.055"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C8F04A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C8F04A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF5"/><stop offset="1" stop-color="#D9D5C8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F04A"/><stop offset="1" stop-color="#A8D63C"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="#0A0C0F"/>
  <rect class="grid" x="-48" y="-48" width="1696" height="496" fill="url(#dots)"/>
  <ellipse class="orb1" cx="1300" cy="70" rx="440" ry="210" fill="url(#glow)"/>
  <ellipse class="orb2" cx="260" cy="360" rx="400" ry="190" fill="url(#glow)"/>
  <circle class="p" cx="240"  cy="430" r="2.2" style="animation-delay:-2.5s; animation-duration:11s"/>
  <circle class="p" cx="520"  cy="445" r="1.8" style="animation-delay:-7s;   animation-duration:13s"/>
  <circle class="p" cx="760"  cy="425" r="2.6" style="animation-delay:-4.2s; animation-duration:10s"/>
  <circle class="p" cx="980"  cy="440" r="1.7" style="animation-delay:-9.5s; animation-duration:14s"/>
  <circle class="p" cx="1180" cy="428" r="2.3" style="animation-delay:-1.2s; animation-duration:12s"/>
  <circle class="p" cx="1380" cy="442" r="1.9" style="animation-delay:-6s;   animation-duration:11.5s"/>
  <circle class="p" cx="1520" cy="435" r="2.4" style="animation-delay:-8.3s; animation-duration:13.5s"/>
  <g transform="translate(126,82)">
    <g class="orbit"><circle cx="110" cy="110" r="140" fill="none" stroke="#C8F04A" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 14"/></g>
    <g class="orbit2"><circle cx="110" cy="110" r="158" fill="none" stroke="#C8F04A" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 22"/></g>
    <g class="logo"><rect width="220" height="220" rx="46" fill="#17150F"/><path d="M212.7,23.0L211.7,22.0L36.0,22.0L35.0,23.0L35.0,28.7L34.0,29.0L34.0,35.7L33.0,36.0L33.0,41.7L32.0,42.0L32.0,47.7L31.0,48.0L31.0,54.7L30.0,55.0L30.0,60.7L29.0,61.0L29.0,67.7L28.0,68.0L28.0,73.7L27.0,74.0L27.0,79.7L26.0,80.0L26.0,86.7L25.0,87.0L25.0,92.7L24.0,93.0L24.0,98.7L23.0,99.0L23.0,104.7L22.0,105.0L22.0,111.7L21.0,112.0L21.0,117.7L20.0,118.0L20.0,123.7L19.0,124.0L19.0,130.7L18.0,131.0L18.0,136.7L17.0,137.0L17.0,142.7L16.0,143.0L16.0,149.7L15.0,150.0L15.0,155.7L14.0,156.0L14.0,161.7L13.0,162.0L13.0,168.7L12.0,169.0L12.0,174.7L11.0,175.0L8.0,198.7L9.0,199.7L40.7,199.7L54.0,116.7L95.7,116.7L95.7,110.0L96.7,109.7L98.7,91.0L99.7,90.7L99.7,85.0L100.7,84.0L60.0,84.0L59.7,78.0L60.7,77.7L60.7,71.0L61.7,70.7L61.7,65.0L62.7,64.7L62.7,59.0L63.7,58.7L64.0,55.7L207.7,55.7Z" fill="#F3F0E8"/><path d="M129.0,84.0L128.0,91.7L127.0,92.0L126.0,104.7L125.0,105.0L125.0,110.7L124.0,111.0L123.0,123.7L122.0,124.0L122.0,129.7L121.0,130.0L119.0,148.7L118.0,149.0L118.0,155.7L117.0,156.0L117.0,161.7L116.0,162.0L116.0,167.7L115.0,168.0L115.0,173.7L114.0,174.0L114.0,179.7L113.0,180.0L111.0,199.7L184.7,199.7L185.7,192.0L186.7,191.7L186.7,186.0L187.7,185.7L188.7,173.0L189.7,172.7L189.7,167.0L190.7,166.0L149.7,165.7L149.7,159.0L150.7,158.7L150.7,153.0L151.7,152.7L151.7,147.0L152.7,146.7L152.7,140.0L153.7,139.7L153.7,134.0L154.7,133.7L154.7,128.0L155.7,127.7L155.7,122.0L156.7,121.7L156.7,115.0L157.7,114.7L157.7,109.0L158.7,108.7L158.7,103.0L159.7,102.7L161.7,84.0Z" fill="#C8F04A"/></g>
  </g>
  <text class="name" x="415" y="182">Federico Taranu</text>
  <g>
    <text class="tag" x="418" y="248">&gt; iOS, games and desktop tools</text>
    <rect class="mask" x="416" y="216" width="661" height="46"/>
    <rect class="cursor" x="418" y="220" width="3" height="38"/>
  </g>
  <text class="sub" x="418" y="300">Fredrich Labs  &#183;  Ferrara, Italy  &#183;  Swift, Cloudflare, Python</text>
  <rect x="0" y="394" width="1600" height="6" fill="url(#barGrad)"/>
  <rect class="beam" x="0" y="392" width="300" height="10" fill="url(#beamGrad)" opacity=".8"/>
</svg>