<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170">
  <style>
    .shine { animation: sweep 8s ease-in-out 7.7s infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-160px); opacity: 0; } 7% { opacity: .6; } 24% { transform: translateX(1040px); opacity: 0; } 100% { transform: translateX(1040px); opacity: 0; } }
    .grid { animation: pan 18s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
  </style>
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C8F04A" opacity="0.05"/></pattern><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="880" height="170" rx="18"/></clipPath></defs>
  <rect width="880" height="170" rx="18" fill="#0C0E11"/>
  <rect width="880" height="170" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <g clip-path="url(#card)"><rect class="grid" x="-48" y="-48" width="976" height="266" fill="url(#dots)"/></g>
  <g clip-path="url(#card)"><rect class="shine" x="0" y="-20" width="140" height="210" fill="url(#shineg)" transform="skewX(-18)"/></g>
  <g transform="translate(26,37)"><rect width="96" height="96" rx="22" fill="#14161A" stroke="#C8F04A" stroke-opacity="0.28"/><rect x="1.5" y="1.5" width="93" height="93" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/><circle cx="82" cy="18" r="6" fill="#C8F04A"/><text x="48.0" y="64.56" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" fill="#C8F04A">b</text></g>
  <text x="150" y="66" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1E9">Bluey Desktop</text>
  <text x="150" y="96" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#A7AEBB">Ubuntu and Windows desktop port of Bluey, the AI</text>
  <text x="150" y="119" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#A7AEBB">assistant originally by Riley (rbrown101010)</text>
  <rect x="150" y="133" width="58.78" height="22" rx="11.0" fill="#C8F04A" fill-opacity="0.05" stroke="#C8F04A" stroke-opacity="0.22"/><text x="179.39" y="148.14" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#BCEA44">Python</text><rect x="216.78" y="133" width="51.65" height="22" rx="11.0" fill="#C8F04A" fill-opacity="0.05" stroke="#C8F04A" stroke-opacity="0.22"/><text x="242.605" y="148.14" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#BCEA44">Swift</text><rect x="276.43" y="133" width="101.56" height="22" rx="11.0" fill="#C8F04A" fill-opacity="0.05" stroke="#C8F04A" stroke-opacity="0.22"/><text x="327.21000000000004" y="148.14" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#BCEA44">Desktop port</text>
  <rect x="774" y="26" width="82" height="28" rx="14.0" fill="#C8F04A" fill-opacity="0.06" stroke="#C8F04A" stroke-opacity="0.55"/><text x="815.0" y="44.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C8F04A" letter-spacing="1.5">ACTIVE</text>
  <text x="856" y="150" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6B7280">federicotaar/bluey-ai-linux &#8599;</text>
</svg>