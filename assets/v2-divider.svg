<svg xmlns="http://www.w3.org/2000/svg" width="880" height="26" viewBox="0 0 880 26">
  <style>
    .shine { animation: sweep 5.5s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-140px); opacity: 0; } 10% { opacity: .8; } 30% { transform: translateX(1020px); opacity: 0; } 100% { transform: translateX(1020px); opacity: 0; } }
  </style>
  <defs><linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8F04A"/><stop offset="1" stop-color="#A8D63C"/></linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="0" y="12" width="880" height="2" rx="1" fill="url(#barGrad)" opacity=".85"/>
  <rect class="shine" x="0" y="10" width="120" height="6" rx="3" fill="url(#beamGrad)"/>
  <circle cx="8" cy="13" r="2.5" fill="#C8F04A" opacity=".35"/>
  <circle cx="872" cy="13" r="2.5" fill="#C8F04A" opacity=".35"/>
</svg>
