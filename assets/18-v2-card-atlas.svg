<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170">
  <style>
    .shine { animation: sweep 8s ease-in-out 4.4s infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-160px); opacity: 0; } 7% { opacity: .6; } 24% { transform: translateX(1040px); opacity: 0; } 100% { transform: translateX(1040px); opacity: 0; } }
    .grid { animation: pan 18s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
  </style>
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C8F04A" opacity="0.05"/></pattern><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="880" height="170" rx="18"/></clipPath></defs>
  <rect width="880" height="170" rx="18" fill="#0C0E11"/>
  <rect width="880" height="170" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <g clip-path="url(#card)"><rect class="grid" x="-48" y="-48" width="976" height="266" fill="url(#dots)"/></g>
  <g clip-path="url(#card)"><rect class="shine" x="0" y="-20" width="140" height="210" fill="url(#shineg)" transform="skewX(-18)"/></g>
  <g transform="translate(26,37)"><rect width="96" height="96" rx="22" fill="#14161A" stroke="#C8F04A" stroke-opacity="0.28"/><rect x="1.5" y="1.5" width="93" height="93" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/><circle cx="72" cy="14" r="2.4" fill="#C8F04A"/><circle cx="82" cy="14" r="2.4" fill="#C8F04A" opacity=".6"/><circle cx="92" cy="14" r="2.4" fill="#C8F04A" opacity=".3"/><circle cx="72" cy="24" r="2.4" fill="#C8F04A" opacity=".6"/><text x="48.0" y="64.56" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" fill="#C8F04A">A</text></g>
  <text x="150" y="66" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1E9">ATLAS</text>
  <text x="150" y="96" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#A7AEBB">Personal intelligence system: memory with verifiable</text>
  <text x="150" y="119" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#A7AEBB">sources, agents and predictions. Local, zero cost</text>
